<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calgary EMS Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0c12; --surface: #111420; --surface2: #181c2e;
      --border: #1e2236; --accent: #4da6ff; --text: #e0e0e0; --muted: #4a5270;
    }
    html, body { height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* HEADER */
    header {
      height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 20px; flex-shrink: 0;
    }
    h1 { font-family: 'IBM Plex Mono', monospace; font-size: 0.88rem; font-weight: 600; color: #fff; white-space: nowrap; flex-shrink: 0; }
    .sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
    .ctrl-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ctrl-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); white-space: nowrap; }
    .toggles { display: flex; gap: 12px; }
    .toggle-row { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; cursor: pointer; color: var(--text); white-space: nowrap; }
    .toggle-row input { accent-color: var(--accent); }
    .header-stats { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .hstat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .hstat-val { font-family: 'IBM Plex Mono', monospace; font-size: 1.1rem; font-weight: 600; color: var(--accent); line-height: 1; }
    .hstat-label { font-size: 0.57rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; white-space: nowrap; }

    /* LAYOUT — critical: explicit heights everywhere */
    #app { display: flex; flex-direction: column; height: calc(100vh - 52px); }
    #map-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

    /* LEGEND OVERLAY */
    #map-legend {
      position: absolute; top: 12px; right: 12px; z-index: 999;
      background: rgba(10,12,18,0.88); backdrop-filter: blur(6px);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 13px; display: flex; flex-direction: column; gap: 7px; pointer-events: none;
    }
    .legend-title { font-family: 'IBM Plex Mono', monospace; font-size: 0.56rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin-bottom: 2px; }
    .legend-row { display: flex; align-items: center; gap: 7px; font-size: 0.74rem; color: #ccc; white-space: nowrap; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.diamond { border-radius: 0; transform: rotate(45deg); width: 9px; height: 9px; }

    /* CHARTS — hidden by default, toggled via button */
    #charts-row { height: 200px; flex-shrink: 0; display: none; background: var(--surface); border-top: 1px solid var(--border); }
    #charts-row.charts-visible { display: flex; }
    .chart-card { flex: 1; min-width: 0; padding: 10px 14px 8px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .chart-card:last-child { border-right: none; }
    .chart-title { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; flex-shrink: 0; }
    /* Key fix: give canvas a concrete height, not flex */
    .chart-card canvas { display: block; width: 100% !important; height: 150px !important; }

    /* STATION PANEL */
    #station-panel {
      position: absolute; left: 0; top: 0; bottom: 0; width: 280px; z-index: 1001;
      background: rgba(10,12,18,0.96); backdrop-filter: blur(8px);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(-100%); transition: transform 0.22s ease;
      pointer-events: none;
    }
    #station-panel.open { transform: translateX(0); pointer-events: all; }
    #panel-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #panel-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 1.2px; }
    #panel-close { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; padding: 0 4px; line-height: 1; }
    #panel-close:hover { color: var(--text); }
    #panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    #panel-name { font-size: 1rem; font-weight: 600; color: #fff; line-height: 1.3; }
    #panel-address { font-size: 0.78rem; color: var(--muted); }
    .panel-divider { height: 1px; background: var(--border); }
    #panel-preview { border-radius: 5px; overflow: hidden; position: relative; }
    #panel-preview a { display: block; position: relative; }
    #panel-preview img { display: block; width: 100%; height: 110px; object-fit: cover; }
    #panel-preview .sv-badge {
      position: absolute; bottom: 6px; right: 7px;
      background: rgba(0,0,0,0.65); color: #fff;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem;
      letter-spacing: 0.6px; padding: 2px 6px; border-radius: 3px; pointer-events: none;
    }
    #panel-preview:not(:empty) { margin-bottom: 10px; }
    .panel-row { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
    .panel-row-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    .panel-row-value { font-size: 0.8rem; color: var(--text); }

    /* CHARTS CONTROLS */
    #charts-controls {
      position: absolute; bottom: 14px; left: 14px; z-index: 999;
      display: flex; align-items: center; gap: 8px;
    }
    #btn-charts {
      background: rgba(10,12,18,0.88); backdrop-filter: blur(6px);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 14px; cursor: pointer; color: var(--accent);
      font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
      text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
    }
    #btn-charts:hover { border-color: var(--accent); background: rgba(17,20,32,0.95); }
    #charts-controls #year-select {
      display: none;
      background: rgba(10,12,18,0.88); backdrop-filter: blur(6px);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 7px 10px;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
      cursor: pointer; outline: none;
    }
    #charts-controls #year-select:hover,
    #charts-controls #year-select:focus { border-color: var(--accent); }
    #charts-controls #year-select option { background: var(--surface2); }
    #charts-controls #year-select.year-visible { display: block; }

    /* SEARCH BOX */
    #search-box {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 999; display: flex;
      background: rgba(10,12,18,0.88); backdrop-filter: blur(6px);
      border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    #search-input {
      background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.82rem;
      padding: 8px 12px; width: 260px;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-btn {
      background: none; border: none; border-left: 1px solid var(--border);
      color: var(--accent); padding: 8px 12px; cursor: pointer; font-size: 1rem; line-height: 1;
    }
    #search-btn:hover { background: var(--surface2); }

    /* SHARE BUTTON */
    #btn-share {
      position: absolute; bottom: 14px; right: 14px; z-index: 999;
      background: rgba(10,12,18,0.88); backdrop-filter: blur(6px);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 14px; cursor: pointer; color: var(--muted);
      font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem;
      text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
    }
    #btn-share:hover { border-color: var(--accent); color: var(--accent); }

    /* MOBILE */
    @media (max-width: 768px) {
      header { flex-wrap: wrap; height: auto; min-height: 52px; padding: 8px 12px; gap: 8px; }
      .header-stats { margin-left: 0; width: 100%; border-top: 1px solid var(--border); padding-top: 6px; }

      /* Search box: full width on mobile */
      #search-box { left: 14px; right: 60px; transform: none; }
      #search-input { width: 100%; }
      #btn-share { display: none; }

      /* Station panel: tall enough to show all data, scrollable */
      #station-panel {
        width: 100%; left: 0; top: auto; bottom: 0;
        height: 65vh; max-height: 65vh;
        transform: translateY(100%);
        border-right: none; border-top: 1px solid var(--border);
      }
      #station-panel.open { transform: translateY(0); }
      #panel-body { flex: 1; overflow-y: auto; }

      /* Historical data: stack charts vertically, scrollable */
      #charts-row {
        flex-direction: column;
        height: 55vh; max-height: 55vh;
        overflow-y: auto;
      }
      .chart-card {
        flex: none;
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 12px 14px;
      }
      .chart-card:last-child { border-bottom: none; }
      .chart-card canvas { height: 180px !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Calgary EMS Dashboard</h1>
    <div class="sep"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">Layers</span>

<div class="toggles">
  <label class="toggle-row"><input type="checkbox" id="toggle-ems" checked><span class="dot" style="background:#4da6ff;"></span>EMS</label>
  <label class="toggle-row"><input type="checkbox" id="toggle-fire" checked><span class="dot" style="background:#e63946;"></span>Fire</label>
  <label class="toggle-row"><input type="checkbox" id="toggle-shared" checked><span class="dot" style="background:#c77dff;"></span>Shared</label>
  <label class="toggle-row"><input type="checkbox" id="toggle-coverage"><span class="dot" style="background:#00ff88;"></span>Coverage</label>
  <label class="toggle-row"><input type="checkbox" id="toggle-hospitals" checked><span style="display:inline-block;width:10px;height:10px;position:relative;flex-shrink:0;"><span style="position:absolute;top:3px;left:0;right:0;height:4px;background:#fff;border-radius:1px;"></span><span style="position:absolute;left:3px;top:0;bottom:0;width:4px;background:#fff;border-radius:1px;"></span></span>Hospitals</label>
  <label class="toggle-row"><input type="checkbox" id="toggle-zones"><span class="dot" style="background:#4da6ff;opacity:0.5;border:1px solid rgba(77,166,255,0.6);"></span>Zones</label>
</div>

    </div>
    <div class="header-stats">
      <div class="hstat"><span id="stat-total" class="hstat-val">–</span><span class="hstat-label">Total Calls</span></div>
      <div class="sep"></div>
      <div class="hstat"><span id="stat-ems" class="hstat-val">–</span><span class="hstat-label">EMS Stations</span></div>
      <div class="sep"></div>
      <div class="hstat"><span id="stat-fire" class="hstat-val">–</span><span class="hstat-label">Fire Stations</span></div>
    </div>
  </header>

  <div id="app">
    <div id="map-wrap">
      <div id="map"></div>
      <div id="search-box">
        <input type="text" id="search-input" placeholder="Search address in Calgary…" autocomplete="off">
        <button id="search-btn">↵</button>
      </div>
      <button id="btn-share">Share ↗</button>
      <div id="station-panel">
        <div id="panel-header">
          <span id="panel-badge"></span>
          <button id="panel-close">×</button>
        </div>
        <div id="panel-body">
          <div id="panel-preview"></div>
          <div id="panel-name"></div>
          <div id="panel-address"></div>
          <div class="panel-divider"></div>
          <div id="panel-details"></div>
        </div>
      </div>
      <div id="charts-controls">
        <button id="btn-charts">Historical Data <span id="btn-charts-arrow">↑</span></button>
        <select id="year-select">
          <option value="">All Years</option>
          <option value="2010">2010</option>
          <option value="2011">2011</option>
          <option value="2012">2012</option>
          <option value="2013">2013</option>
          <option value="2014">2014</option>
          <option value="2015">2015</option>
          <option value="2016">2016</option>
          <option value="2017">2017</option>
          <option value="2018">2018</option>
          <option value="2019">2019</option>
        </select>
      </div>
      <div id="map-legend">
        <div class="legend-title">Legend</div>
        <div class="legend-row"><span class="dot" style="background:#4da6ff;"></span>EMS Station</div>
        <div class="legend-row"><span class="dot" style="background:#e63946;"></span>Fire Station</div>
        <div class="legend-row"><span class="dot" style="background:#c77dff;"></span>Shared Stations</div>
        <div class="legend-row"><span class="dot diamond" style="background:#ffd166;"></span>Fire HQ (Station 16)</div>
	<div class="legend-row"><span class="dot diamond" style="background:#ff9f1c;"></span>EMS Superstation</div>
        <div class="legend-row">
          <span style="display:inline-block;width:10px;height:10px;position:relative;flex-shrink:0;">
            <span style="position:absolute;top:3px;left:0;right:0;height:4px;background:#fff;border-radius:1px;"></span>
            <span style="position:absolute;left:3px;top:0;bottom:0;width:4px;background:#fff;border-radius:1px;"></span>
          </span>Hospital
        </div>
        <div class="legend-row"><span class="dot" style="background:#4da6ff;opacity:0.5;border:1px solid rgba(77,166,255,0.6);"></span>EMS Response Zone</div>
      </div>
    </div>

    <div id="charts-row">
      <div class="chart-card"><div class="chart-title">Calls by Month</div><canvas id="chart-month"></canvas></div>
      <div class="chart-card"><div class="chart-title">Calls by Day of Week</div><canvas id="chart-day"></canvas></div>
      <div class="chart-card"><div class="chart-title">Calls by Incident Type</div><canvas id="chart-type"></canvas></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
